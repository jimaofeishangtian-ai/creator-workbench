<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接当前Edge · 本机配对</title>
<style>body{margin:0;background:#f4f5ef;font-family:"Microsoft YaHei",system-ui,sans-serif;color:#2c3327;line-height:1.8}main{max-width:580px;margin:10vh auto;padding:32px;background:white;border:1px solid #e1e6d9;border-radius:20px}h1{font-size:25px;margin-top:0}p{color:#697160;font-size:14px}label{display:block;font-weight:600;font-size:14px}input{display:block;width:100%;box-sizing:border-box;padding:13px;border:1px solid #d3dcc6;border-radius:10px;margin:10px 0 16px}button{background:#d9edab;border:0;border-radius:10px;padding:12px 20px;font-weight:600;cursor:pointer}button:disabled{opacity:.5;cursor:default}a{color:#597d30}#pairing-message{padding:12px;background:#f4f7ee;border-radius:10px}@media(max-width:650px){main{margin:24px 16px;padding:24px}}</style></head>
<body><main><h1>连接你当前的Edge</h1><p>这是电脑本机的组件配对，不是抖音登录。已同意并加载本地连接扩展后，刷新此页即可检测组件。</p>
