name: Verify Windows package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -r assets/workbench/backend/requirements.txt -r assets/workbench/backend/requirements-dev.txt
      - name: Build frontend
        working-directory: assets/workbench/frontend
        run: |
          npm ci
          npm run build
      - name: Test frontend helpers
        working-directory: assets/workbench/frontend
        run: node --test tests/*.test.mjs
      - name: Test backend without paid providers
        working-directory: assets/workbench/backend
        run: python -m pytest -q
